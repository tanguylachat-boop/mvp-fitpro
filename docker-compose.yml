version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fitos-pro-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fitospro
      POSTGRES_PASSWORD: fitospro_dev_password
      POSTGRES_DB: fitospro_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitospro"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
